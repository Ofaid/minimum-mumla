name: Android CI Build - Real Green & Artifact

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Grant Execute Permission for Gradle Wrapper
      run: chmod +x gradlew

    - name: Perbaiki Otomatis Modul Library Humla
      run: |
        echo "Memeriksa dan membuat file build.gradle otomatis menggunakan warisan plugin utama..."
        mkdir -p libraries/humla
        cat << 'EOF' > libraries/humla/build.gradle
        // Perbaikan: Menggunakan apply plugin agar mewarisi versi dari root build.gradle
        apply plugin: 'com.android.library'

        android {
            namespace 'se.lublin.humla'
            compileSdk 35
            defaultConfig {
                minSdk 21
            }
            
            flavorDimensions "release"
            productFlavors {
                beta {
                    dimension "release"
                }
            }
        }
        EOF

    - name: Clean Project
      run: ./gradlew clean 

    - name: Build Android App
      run: ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: "**/build/outputs/apk/**/*.apk"
