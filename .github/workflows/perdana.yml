name: perdana

on:
  push:
    branches: [ "*dev*" ] # Berjalan di cabang mana pun Anda melakukan push
  pull_request:
    branches: [ "*dev*" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Menghindari error 'git describe' pada build.gradle asli

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Grant Execute Permission for Gradle Wrapper
      run: chmod +x gradlew

    - name: Clean Project
      run: ./gradlew clean # Membersihkan sisa build lama agar tidak konflik

    - name: Build Android App
      run: ./gradlew assemble --no-daemon --stacktrace # Membangun semua varian yang tersedia

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-apks
        path: "**/build/outputs/apk/**/*.apk" # Mengamankan semua file APK yang berhasil dibuat
