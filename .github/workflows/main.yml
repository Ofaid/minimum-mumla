name: Android CI Build - Submodule Check

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 
        # Memaksa GitHub mengunduh seluruh submodul dari alamat eksternal
        submodules: 'recursive'
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Inisialisasi Submodul Manual (Cadangan)
      run: |
        git submodule init
        git submodule update --init --recursive || true

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Grant Execute Permission for Gradle Wrapper
      run: chmod +x gradlew

    - name: Clean Project
      run: ./gradlew clean 

    - name: Build Android App
      run: ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: "**/build/outputs/apk/**/*.apk"
