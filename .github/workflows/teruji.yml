name: Android CI Build - Fix Green Check

on:
  push:
    branches: [ "dev" ] # GANTI "dev" dengan nama cabang aktif Anda saat ini
  pull_request:
    branches: [ "dev" ] # GANTI "dev" dengan nama cabang aktif Anda saat ini
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Grant Execute Permission for Gradle Wrapper
      run: chmod +x gradlew

    - name: Clean Project
      run: ./gradlew clean 

    - name: Build Android App
      run: ./gradlew assemble --no-daemon --stacktrace 

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-apks
        path: "**/build/outputs/apk/**/*.apk"
