name: Bangun APK Mumla

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  bangun:
    name: Build Aplikasi
    runs-on: ubuntu-latest

    steps:
      - name: Cari Kode Sumber
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          ndk-version: '25.1.8937393'

      - name: Izin Gradle
        run: chmod +x gradlew

      - name: Bangun Aplikasi
        run: ./gradlew clean :app:assembleBetaDebug

      - name: Upload APK Hasil
        uses: actions/upload-artifact@v4
        with:
          name: Mumla-APK
          path: app/build/outputs/apk/beta/debug/*.apk
